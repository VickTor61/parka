services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: parka
      POSTGRES_PASSWORD: parka
      POSTGRES_DB: parka_production
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parka"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DATABASE_URL: postgres://parka:parka@db:5432/parka_production
      REDIS_URL: redis://redis:6379/1
      RAILS_MAX_THREADS: 5
    ports:
      - "3001:80"
